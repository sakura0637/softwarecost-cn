# 软件造价喵平台 - Nginx 反向代理配置
# 用法:
#   sudo cp nginx-softwarecost.conf /etc/nginx/sites-enabled/softwarecost.conf
#   sudo rm -f /etc/nginx/sites-enabled/default   # 去掉默认站点(可选)
#   sudo nginx -t && sudo systemctl reload nginx
#
# 如需 HTTPS，把下面 server 块里的 listen 80 改为 listen 443 ssl;
# 并补上 ssl_certificate / ssl_certificate_key 路径（可用 certbot 申请免费证书）。

server {
    listen 80;
    server_name _;   # 改成你的域名，如 softwarecost.example.com；仅 IP 访问用 _

    # 上传文件大小限制（文档解析接口可能传大文件）
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
